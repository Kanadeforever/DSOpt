[CrashFix]
; 0=禁用；1-8=限制进程使用前 N 个当前允许的逻辑处理器；非法值回退为 4
CoreLimit=4

[Window]
; 优先启用 Per-Monitor V2 DPI 感知，旧版 Windows 自动回退
DPIAware=1
; 启动后将游戏窗口转换为无边框窗口
Borderless=1
; 普通窗口模式下，在启动和分辨率变化后自动居中
CenterWindow=1
; 让游戏窗口保持置顶
AlwaysOnTop=0
; 无边框切换热键的虚拟键码；0=禁用，121=F10
ToggleKey=121
; 窗口样式、位置和置顶状态的维护周期，范围 100-60000 毫秒
PollInterval=1000

[Subtitle]
; 同时修复字幕预排版、自动换行、行数容量和最终绘制
FixFullPipelineScaling=1
; 0=自动使用游戏实际渲染高度/BaseHeight；正数=固定手动倍率
Scale=0
; 游戏开发分辨率的纵向基准
BaseHeight=720
; 1=720p及以下保留原版大小；0=低分辨率也严格等比例缩放
OnlyAboveBase=1

[Debug]
; 输出简体中文 UTF-8 日志到 DSOpt.log
Log=0
